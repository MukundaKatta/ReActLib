[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reactlib"
version = "0.1.0"
description = "ReAct pattern implementation for building step-by-step AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Officethree Technologies"}]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/reactlib"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
